# Foundry config. The contracts also build and test without Foundry:
#   node tools/chain/compile.mjs     and     node --test tests/chain-contracts.test.mjs
# (same compiler settings: tools/chain/compile.mjs SETTINGS).
# OpenZeppelin comes from the repo's node_modules (npm install at the repo root).
[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
remappings = ["@openzeppelin/=../node_modules/@openzeppelin/"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
