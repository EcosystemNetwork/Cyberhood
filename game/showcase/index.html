<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cyberhood: The Hollow Chapel</title>
<meta name="description" content="Cyberhood visual showcase: one knight, one sword, one ruined chapel at dusk.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #efe6d2; --ink-dim: #b8ad97; --gold: #d8b46a; --blood: #b3261e; --stam: #c9b26a; --panel: rgba(12, 10, 9, 0.62);
    --line: rgba(216, 180, 106, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a0c; color: var(--ink); font: 14px/1.4 Inter, system-ui, sans-serif; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* ---- loading / title */
  #title { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity 1.2s ease; z-index: 5; }
  #title.gone { opacity: 0; }
  #title .card { text-align: center; padding: 0 16px; }
  #title h1 { font: 700 clamp(30px, 6vw, 64px)/1.05 Cinzel, serif; letter-spacing: 0.12em; margin: 0; color: var(--ink);
    text-shadow: 0 2px 24px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9); }
  #title h2 { font: 500 clamp(12px, 1.8vw, 17px) Cinzel, serif; letter-spacing: 0.42em; margin: 12px 0 0; color: var(--gold); text-shadow: 0 1px 12px #000; }
  #title .hint { margin-top: 34px; font-size: 13px; letter-spacing: 0.2em; color: var(--ink-dim); text-transform: uppercase; text-shadow: 0 1px 8px #000; opacity: 0; transition: opacity 0.6s; }
  #title.ready .hint { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.45; } }
  #bar { width: min(320px, 70vw); height: 2px; background: rgba(255,255,255,0.12); margin: 28px auto 0; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.25s; }
  #title.ready #bar { opacity: 0; transition: opacity 0.6s; }
  #veil { position: fixed; inset: 0; background: #0b0a0c; z-index: 4; transition: opacity 1.6s ease; pointer-events: none; }
  #veil.gone { opacity: 0; }

  /* ---- HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.8s; z-index: 3; }
  #hud.on { opacity: 1; }
  .bars { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); width: min(300px, 46vw); }
  .bars .name { font: 600 13px Cinzel, serif; letter-spacing: 0.18em; color: var(--ink); margin-bottom: 6px; text-shadow: 0 1px 6px #000; }
  .meter { height: 9px; background: rgba(0,0,0,0.55); border: 1px solid var(--line); margin-top: 5px; position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0; transform-origin: left; transition: transform 0.12s linear; }
  .meter .lag { background: rgba(255, 230, 200, 0.35); transition: transform 0.6s ease 0.25s; }
  #hp i.fill { background: linear-gradient(#c8342b, #861a14); }
  #st { height: 5px; }
  #st i.fill { background: linear-gradient(#d9c27c, #9c8640); }
  .keys { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); text-align: right; font-size: 12px; color: var(--ink-dim); line-height: 1.8; text-shadow: 0 1px 6px #000; }
  .keys b { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); font-weight: 600; text-align: center; background: rgba(0,0,0,0.35); }
  #toast { position: absolute; top: 18%; left: 0; right: 0; text-align: center; font: 700 clamp(22px, 4vw, 40px) Cinzel, serif; letter-spacing: 0.25em; color: var(--ink); text-shadow: 0 2px 20px #000; opacity: 0; transition: opacity 0.4s; }
  #toast.on { opacity: 1; }
  #toast.red { color: #e0574a; }
  #kills { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right)); font: 600 12px Cinzel, serif; letter-spacing: 0.2em; color: var(--ink-dim); text-shadow: 0 1px 6px #000; }
  #boss { position: fixed; left: 50%; top: max(22px, env(safe-area-inset-top)); transform: translateX(-50%); width: min(520px, 80vw); text-align: center; z-index: 3; opacity: 0; transition: opacity 0.6s; pointer-events: none; }
  #boss.on { opacity: 1; }
  #boss .bn { font: 700 14px Cinzel, serif; letter-spacing: 0.3em; color: #e9d6c4; text-shadow: 0 1px 8px #000; margin-bottom: 6px; }
  #boss .meter { height: 8px; }
  #boss .fill { background: linear-gradient(#b8452c, #6e1d10); }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse at center, transparent 45%, rgba(140, 10, 6, 0.55)); opacity: 0; transition: opacity 0.5s; }

  /* nameplates + damage numbers (positioned in JS) */
  #plates { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .plate { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; transition: opacity 0.25s; }
  .plate .n { font: 600 11px Cinzel, serif; letter-spacing: 0.14em; color: #f0d9d0; text-shadow: 0 1px 4px #000, 0 0 2px #000; }
  .plate .hb { width: 84px; height: 5px; margin: 3px auto 0; background: rgba(0,0,0,0.6); border: 1px solid rgba(200, 60, 50, 0.5); position: relative; }
  .plate .hb i { position: absolute; inset: 0; background: #c0342b; transform-origin: left; transition: transform 0.15s; }
  .plate.threat .n { color: #ff9a7a; }
  .dmg { position: absolute; font: 700 18px Cinzel, serif; color: #fff0d8; text-shadow: 0 2px 6px #000, 0 0 3px #000; transform: translate(-50%, -50%); pointer-events: none; }
  .dmg.crit { color: #ffcc66; font-size: 24px; }
  .dmg.block { color: #cfd8e6; font-size: 14px; letter-spacing: 0.15em; }

  /* perf overlay (F3 / ?stats) */
  #stats { position: fixed; left: 10px; top: 10px; font: 11px/1.45 ui-monospace, monospace; color: #d6f5c9; background: rgba(0,0,0,0.6); padding: 6px 9px; z-index: 6; display: none; white-space: pre; }

  /* touch controls */
  #touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; display: none; }
  body.touch #touch { display: block; }
  body.touch .keys { display: none; }
  #stick { position: absolute; left: max(26px, env(safe-area-inset-left)); bottom: max(88px, calc(env(safe-area-inset-bottom) + 70px)); width: 124px; height: 124px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0,0,0,0.22); pointer-events: auto; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(239, 230, 210, 0.22); border: 1px solid var(--line); }
  .tb { position: absolute; width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--ink); font: 600 11px Cinzel, serif; letter-spacing: 0.08em; display: grid; place-items: center; pointer-events: auto; user-select: none; -webkit-user-select: none; }
  .tb.on { background: rgba(216, 180, 106, 0.3); }
  #tAtk { right: max(26px, env(safe-area-inset-right)); bottom: max(100px, calc(env(safe-area-inset-bottom) + 80px)); width: 78px; height: 78px; }
  #tBlk { right: max(118px, calc(env(safe-area-inset-right) + 92px)); bottom: max(84px, calc(env(safe-area-inset-bottom) + 64px)); }
  #tHvy { right: max(122px, calc(env(safe-area-inset-right) + 96px)); bottom: max(176px, calc(env(safe-area-inset-bottom) + 156px)); }
  #tRol { right: max(40px, calc(env(safe-area-inset-right) + 14px)); bottom: max(196px, calc(env(safe-area-inset-bottom) + 176px)); }
  body.touch .bars { bottom: max(14px, env(safe-area-inset-bottom)); }
  @media (prefers-reduced-motion: reduce) { #title.ready .hint { animation: none; } }
</style>
<script>
  window.__errs = [];
  addEventListener('error', (e) => __errs.push(String(e.message || e)));
  addEventListener('unhandledrejection', (e) => __errs.push(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="veil"></div>
<div id="title">
  <div class="card">
    <h1>THE HOLLOW CHAPEL</h1>
    <h2>CYBERHOOD</h2>
    <div id="bar"><i></i></div>
    <div class="hint" id="hint">Click to begin</div>
  </div>
</div>
<div id="plates"></div>
<div id="flash"></div>
<div id="boss"><div class="bn">THE OSSUARY WARDEN</div><div class="meter"><i class="lag"></i><i class="fill"></i></div></div>
<div id="hud">
  <div class="bars">
    <div class="name">WARDEN</div>
    <div class="meter" id="hp"><i class="lag"></i><i class="fill"></i></div>
    <div class="meter" id="st"><i class="fill"></i></div>
  </div>
  <div id="kills"></div>
  <div class="keys">
    Move <b>WASD</b> &nbsp; Sprint <b>Shift</b><br>
    Attack <b>LMB</b> &nbsp; Block / parry <b>RMB</b><br>
    Heavy <b>E</b> hold &nbsp; Dodge <b>Space</b><br>
    Quality <b>G</b> &nbsp; Stats <b>F3</b>
  </div>
  <div id="toast"></div>
</div>
<div id="touch">
  <div id="stick"><i></i></div>
  <div class="tb" id="tAtk">STRIKE</div>
  <div class="tb" id="tBlk">GUARD</div>
  <div class="tb" id="tRol">ROLL</div>
  <div class="tb" id="tHvy">HEAVY</div>
</div>
<div id="stats"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
