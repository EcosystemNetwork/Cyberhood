[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# The game API loads the economy rules (an ES module shared with the game) at runtime, which
# the bundler can't see on its own: ship them with the function.
[functions]
  included_files = ["game/items.js", "game/world3d/economy.js", "game/world3d/shops.js", "game/world3d/farm.js", "game/world3d/blocks.js", "game/world3d/package.json"]

# The site is just the game.
[[redirects]]
  from = "/"
  to = "/game/"
  status = 302
  force = true

# Game API (login, signup, save) -> Netlify function wrapping api/game/[action].js
[[redirects]]
  from = "/api/game/:action"
  to = "/.netlify/functions/game-api?action=:action"
  status = 200
  force = true

# Old 2D world/city routes now live in the 3D world.
[[redirects]]
  from = "/game/world"
  to = "/game/world3d/"
  status = 302
  force = true
[[redirects]]
  from = "/game/world/"
  to = "/game/world3d/"
  status = 302
  force = true
[[redirects]]
  from = "/game/world/index.html"
  to = "/game/world3d/"
  status = 302
  force = true
[[redirects]]
  from = "/game/city"
  to = "/game/world3d/?area=city"
  status = 302
  force = true
[[redirects]]
  from = "/game/city/"
  to = "/game/world3d/?area=city"
  status = 302
  force = true
[[redirects]]
  from = "/game/city/index.html"
  to = "/game/world3d/?area=city"
  status = 302
  force = true
